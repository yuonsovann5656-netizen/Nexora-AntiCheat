  cracked-kick: "<#FF0000><bold>BAYON SECURITY</bold></#FF0000>\n\n<red>Premium Mojang account required.\nPlease buy Minecraft at minecraft.net.</red>"
  unban-success: "<prefix><green>Player <yellow><target></yellow> has been unbanned and their kick counter reset.</green>"
  unban-ip-success: "<prefix><green>IP address <yellow><target></yellow> has been unbanned.</green>"
  block: "<prefix><red>Suspicious interaction was blocked by <#FF0000>Bayon</#FF0000>.</red>"
