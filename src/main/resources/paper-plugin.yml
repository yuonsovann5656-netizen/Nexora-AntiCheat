name: BayonAntiCheat
version: '1.0.0'
main: com.nexora.anticheat.NexoraPlugin
api-version: '26.2'
description: Enterprise-grade, lag-compensated anticheat plugin for modern Paper servers.
authors:
  - Bayon Security Team
website: https://github.com/bayon/anticheat

permissions:
  bayon.admin:
    description: Full administrative access to Bayon AntiCheat
    default: op
    children:
      bayon.alerts: true
      bayon.bypass: false
      bayon.command.help: true
      bayon.command.reload: true
      bayon.command.info: true
      bayon.command.history: true
      bayon.command.reset: true
      bayon.command.punish: true
      bayon.command.exempt: true
      bayon.command.gui: true
      bayon.command.debug: true
      bayon.command.scan: true
      nexora.admin: true

  bayon.alerts:
    description: Allows staff members to receive in-game cheat violation alerts
    default: op

  bayon.bypass:
    description: Bypasses all Bayon anti-cheat detections
    default: false

  bayon.command.help:
    description: Access to /byac help
    default: op

  bayon.command.reload:
    description: Access to /byac reload
    default: op

  bayon.command.info:
    description: View detailed anti-cheat telemetry and VL info for a player
    default: op

  bayon.command.history:
    description: View logged violation history for a player
    default: op

  bayon.command.reset:
    description: Reset violation levels for a player
    default: op

  bayon.command.punish:
    description: Manually execute punishments on a player
    default: op

  bayon.command.exempt:
    description: Temporarily exempt a player from anti-cheat checks
    default: op

  bayon.command.gui:
    description: Open the interactive staff anti-cheat GUI (/byac gui)
    default: op

  bayon.command.debug:
    description: Toggle or view debug information for specific checks
    default: op

  bayon.command.scan:
    description: Scan a player for illegal PvP modifications (/byac scan <player>)
    default: op

  # Legacy aliases for backwards compatibility
  nexora.admin:
    description: Legacy alias for bayon.admin
    default: op
    children:
      bayon.admin: true
  nexora.alerts:
    default: op
  nexora.bypass:
    default: false
  nexora.command.help:
    default: op
  nexora.command.reload:
    default: op
  nexora.command.info:
    default: op
  nexora.command.history:
    default: op
  nexora.command.reset:
    default: op
  nexora.command.punish:
    default: op
  nexora.command.exempt:
    default: op
  nexora.command.gui:
    default: op
  nexora.command.debug:
    default: op
